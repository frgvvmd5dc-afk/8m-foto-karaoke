name: Windows und Mac herunterladen
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable exe
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon icon.ico --name 8M-Foto-Karaoke app.py
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 ist nicht verfügbar.' }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: 8M-Windows-Installer-und-Portable
          path: |
            dist/8M-Foto-Karaoke.exe
            dist/8M-Foto-Karaoke-Setup.exe
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
          - runner: macos-15-intel
            architecture: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mac-App und DMG
        run: bash build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 8M-macOS-${{ matrix.architecture }}
          path: dist/8M-Foto-Karaoke-macOS.dmg
  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 8M-*
          path: downloads
      - name: Dateien für öffentliche Downloads benennen
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp downloads/8M-Windows-Installer-und-Portable/*.exe release/
          cp downloads/8M-macOS-Apple-Silicon/8M-Foto-Karaoke-macOS.dmg release/8M-Foto-Karaoke-macOS-Apple-Silicon.dmg
          cp downloads/8M-macOS-Intel/8M-Foto-Karaoke-macOS.dmg release/8M-Foto-Karaoke-macOS-Intel.dmg
      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v1.0.${{ github.run_number }}" release/* \
            --repo "${{ github.repository }}" \
            --title "8M Foto Karaoke v1.0.${{ github.run_number }}" \
            --notes "Windows-Installer, portable Windows-Version und macOS für Apple Silicon und Intel. Ohne digitale Signatur."
